name: test
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Check the lockfile
        run: uv lock --check

      - name: Run linting
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run type checking
        run: uv run ty check

  test-package:
    name: test-python-${{ matrix.python-version }}
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest

  benchmark:
    name: benchmark-tests
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gcc
          version: 13

      - name: Cache Fortran executable
        id: cache-executable
        uses: actions/cache@v6
        with:
          path: benchmark/fftlogtest
          key: fftlogtest-${{ runner.os }}-${{ hashFiles('benchmark/*.f') }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Cache benchmark files
        id: cache-benchmarks
        uses: actions/cache@v6
        with:
          path: tests/benchmarks
          key: benchmarks-${{ hashFiles('scripts/generate_benchmarks.py') }}

      - name: Generate benchmarks
        if: steps.cache-benchmarks.outputs.cache-hit != 'true'
        run: |
          echo "Generating benchmarks (this will take a few minutes)..."
          python scripts/generate_benchmarks.py

      - name: Verify benchmarks
        run: |
          count=$(ls tests/benchmarks/*.txt 2>/dev/null | wc -l)
          echo "Found $count benchmark files"
          if [ "$count" -ne "216" ]; then
            echo "ERROR: Expected 216 benchmark files, found $count"
            exit 1
          fi

      - name: Run benchmark tests
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest tests/test_benchmark.py --run-benchmarks -v
