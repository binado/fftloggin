[project]
name = "fftloggin"
version = "0.5.0"
description = "Differentiable FFTLog transforms built on JAX"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
keywords = [
    "fftlog",
    "hankel-transform",
    "numerical-analysis",
    "scientific-computing",
    "astronomy",
    "cosmology",
    "vectorized"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.0",
    "jaxtyping",
]

[project.urls]
Homepage = "https://github.com/binado/fftloggin"
Repository = "https://github.com/binado/fftloggin.git"
Issues = "https://github.com/binado/fftloggin/issues"
Documentation = "https://github.com/binado/fftloggin#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "ruff>=0.16.0",
    { include-group = "test" },
]
test = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pytest>=9.1.1",
]
tutorial = [
    "camb>=1.6.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]
"src/fftloggin/*.py" = ["F821", "UP037"]

[tool.ty.src]
include = ["src", "tests"]
