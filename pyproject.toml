[project]
name = "fftloggin"
version = "0.2.1"
description = "High-performance vectorized FFTLog implementation for fast Hankel transforms in pure Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
keywords = [
    "fftlog",
    "hankel-transform",
    "numerical-analysis",
    "scientific-computing",
    "astronomy",
    "cosmology",
    "vectorized"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.1",
]

[project.urls]
Homepage = "https://github.com/binado/fftloggin"
Repository = "https://github.com/binado/fftloggin.git"
Issues = "https://github.com/binado/fftloggin/issues"
Documentation = "https://github.com/binado/fftloggin#readme"

[project.scripts]
fftloggin = "fftloggin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.12.11",
    { include-group = "test" },
]
benchmark = [
    "memray>=1.14.0",
]
fftw = [
    "pyfftw>=0.13.1",
]
test = [
    "pytest>=8.4.1",
]
tutorial = [
    "camb>=1.6.4",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["tests", "src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
