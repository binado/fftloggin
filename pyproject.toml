[project]
name = "fftloggin"
version = "0.1.0"
description = "Vectorized FFTLog in pure python"
readme = "README.md"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.2",
    "scipy>=1.16.1",
]

[project.scripts]
fftloggin = "fftloggin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.12.11",
    { include-group = "test" }
]
numexpr = [
    "numexpr>=2.11.0",
]
test = [
    "pytest>=8.4.1",
    { include-group = "numexpr" }
]
