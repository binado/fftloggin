[project]
name = "fftloggin"
version = "0.5.0"
description = "Differentiable FFTLog transforms built on JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
keywords = [
    "fftlog",
    "hankel-transform",
    "numerical-analysis",
    "scientific-computing",
    "astronomy",
    "cosmology",
    "vectorized"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.0",
    "jaxtyping",
]

[project.urls]
Homepage = "https://github.com/binado/fftloggin"
Repository = "https://github.com/binado/fftloggin.git"
Issues = "https://github.com/binado/fftloggin/issues"
Documentation = "https://fftloggin.readthedocs.io/en/latest/"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "beartype",
    "prek>=0.5.3",
    "ruff>=0.16.0",
    "ty>=0.0.83",
    { include-group = "test" },
]
test = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pytest>=9.1.1",
    "mpmath>=1.3.0",
]
tutorial = [
    "camb>=1.6.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]
docs = [
    "camb>=1.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pydata-sphinx-theme>=0.21.0",
    "scipy>=1.17.1",
    "sphinx>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]
"src/fftloggin/*.py" = ["F821", "UP037"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["tests/legacy"]
